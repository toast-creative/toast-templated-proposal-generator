services:
  db:
    image: postgres:16-alpine
    container_name: toast-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: harness
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d harness"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toast-templated-proposal-generator
    env_file:
      - .dev.vars
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@db:5432/harness?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8787:8787"
      - "5173:5173"
      - "5174:5174"
      - "4174:4174"
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npx concurrently -n server,web -c blue,magenta \"npm run dev:server\" \"npx vite --host 0.0.0.0 --port 5173\""

volumes:
  postgres_data:
